name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run test:mcp

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci --prefix remote-stream
      - run: npm run package:vsix
      - run: npm run package:stream
      - uses: actions/upload-artifact@v7
        with:
          name: tunnelterm-vsix
          path: |
            tunnelterm-vscode-*.vsix
            remote-stream/tunnelterm-stream-*.vsix
          if-no-files-found: error
